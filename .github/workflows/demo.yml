name: Deploy website
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Test code
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      jsfile: ${{ steps.getjs.outputs.jsfile }}
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Download build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/

      - name: Get JS filename
        id: getjs
        run: |
          JS_FILE=$(find dist -type f -name "*.js" | head -n 1)
          echo "Found JS file: $JS_FILE"
          echo "jsfile=$JS_FILE" >> $GITHUB_OUTPUT
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: output contents
        run: ls

      - name: Show JS filename from build job
        run: echo "JS file from build: ${{ needs.build.outputs.jsfile }}"
        
      - name: Deploy
        run: echo "Deploying..."
